<body>

<header>

    <div class="logo">
        <i class="fa-solid fa-camera-retro"></i>
        <h1>Galeria Premium</h1>
    </div>

    <div class="pesquisa">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar imagens...">

    </div>

    <button id="tema">
        <i class="fa-solid fa-moon"></i>
    </button>

</header>


<section class="dashboard">

    <div class="box">
        <h2 id="totalFotos">0</h2>
        <span>Fotos</span>
    </div>

    <div class="box">
        <h2 id="totalFavoritos">0</h2>
        <span>Favoritos</span>
    </div>

    <div class="box">
        <h2 id="categoriaAtual">Todas</h2>
        <span>Categoria</span>
    </div>

</section>


<section class="categorias">

<button class="ativo">Todas</button>

<button>Carros</button>

<button>Futebol</button>

<button>Natureza</button>

<button>Religião</button>

<button>Praias</button>

<button>Anime</button>

</section>


<main id="galeria">

</main>


<div id="lightbox">

<div class="conteudo">

<button id="fechar">

<i class="fa-solid fa-xmark"></i>

</button>

<img id="imagemExpandida">

<h2 id="tituloImagem"></h2>

<p id="descricaoImagem"></p>

<button id="favoritar">

<i class="fa-solid fa-heart"></i>

Favoritar

</button>

</div>

</div>


<footer>

<p>

© 2026 Galeria Premium

</p>

</footer>
